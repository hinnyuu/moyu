name: fullstack

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml jsonschema pillow fastapi httpx uvicorn
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web/app/package-lock.json
      - run: npm ci
        working-directory: modules/web/app
      - run: npm run build
        working-directory: modules/web/app
      - run: npx playwright install --with-deps chromium
        working-directory: modules/web/app
      - name: Full stack Playwright
        run: bash modules/deploy/scripts/fullstack_e2e.sh 2>&1 | tee /tmp/fullstack.log
      - name: Commit failure log
        if: failure()
        run: |
          cp /tmp/fullstack.log fullstack-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fullstack-error.log || true
          git commit -m "ci: fullstack 失败日志" || true
          git push origin main || true
