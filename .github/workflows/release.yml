name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          podman build --layers -f modules/deploy/container/Containerfile \
            --build-arg TARGETARCH=amd64 -t moyu:release-amd64 .
      - run: |
          podman tag moyu:release-amd64 "${IMAGE}:${GITHUB_REF_NAME}-amd64"
          podman tag moyu:release-amd64 "${IMAGE}:sha-${GITHUB_SHA::12}-amd64"
          podman push "${IMAGE}:${GITHUB_REF_NAME}-amd64"
          podman push "${IMAGE}:sha-${GITHUB_SHA::12}-amd64"

  build-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          podman build --layers -f modules/deploy/container/Containerfile \
            --build-arg TARGETARCH=arm64 -t moyu:release-arm64 .
      - run: |
          podman tag moyu:release-arm64 "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          podman tag moyu:release-arm64 "${IMAGE}:sha-${GITHUB_SHA::12}-arm64"
          podman push "${IMAGE}:${GITHUB_REF_NAME}-arm64"
          podman push "${IMAGE}:sha-${GITHUB_SHA::12}-arm64"

  publish:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y podman
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Create multi-arch manifests
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          for NAME in "$TAG" "$SHA_TAG" latest; do
            podman manifest create "${IMAGE}:${NAME}"
            podman manifest add "${IMAGE}:${NAME}" "docker://${IMAGE}:${TAG}-amd64"
            podman manifest add "${IMAGE}:${NAME}" "docker://${IMAGE}:${TAG}-arm64"
            podman manifest push --all "${IMAGE}:${NAME}" "docker://${IMAGE}:${NAME}"
          done
      - name: Install supply-chain tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - name: SBOM
        run: syft "${IMAGE}:${GITHUB_REF_NAME}" -o spdx-json=sbom.spdx.json
      - name: Vulnerability report
        run: |
          trivy image --format table --output trivy.txt --exit-code 0 "${IMAGE}:${GITHUB_REF_NAME}"
          trivy image --format sarif --output trivy.sarif "${IMAGE}:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: |
            trivy.txt
            trivy.sarif
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.spdx.json
            trivy.txt
