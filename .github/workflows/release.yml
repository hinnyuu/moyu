name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build image
        run: |
          podman build --layers \
            -f modules/deploy/container/Containerfile \
            --build-arg TARGETARCH=amd64 \
            -t moyu:release .
      - name: Push tags
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          podman tag moyu:release "${IMAGE}:${TAG}"
          podman tag moyu:release "${IMAGE}:${SHA_TAG}"
          podman tag moyu:release "${IMAGE}:latest"
          podman push "${IMAGE}:${TAG}"
          podman push "${IMAGE}:${SHA_TAG}"
          podman push "${IMAGE}:latest"
      - name: Install supply-chain tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin
      - name: SBOM
        run: syft "${IMAGE}:${GITHUB_REF_NAME}" -o spdx-json=sbom.spdx.json
      - name: Vulnerability report
        run: |
          trivy image --format table --output trivy.txt --exit-code 0 \
            "${IMAGE}:${GITHUB_REF_NAME}"
          trivy image --format sarif --output trivy.sarif \
            "${IMAGE}:${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: trivy
          path: |
            trivy.txt
            trivy.sarif
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.spdx.json
            trivy.txt
