name: python

on:
  push:
  pull_request:

jobs:
  modules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml pillow jsonschema fastapi httpx uvicorn
      - name: Run module tests
        run: |
          set -e
          for tests in modules/*/tests; do
            echo "== $tests =="
            python3 -m unittest discover -s "$tests" -v
          done
      - name: Process end-to-end
        run: python3 modules/deploy/scripts/process_e2e.py
      - name: Upload session restart resume
        run: python3 modules/deploy/scripts/restart_resume_e2e.py
      - name: ZIP64 >4GiB entry
        run: python3 modules/archive-zip/scripts/large_file_e2e.py
