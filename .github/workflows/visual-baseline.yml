name: visual-baseline

on:
  workflow_dispatch:
  push:
    branches: [visual-baseline]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web/app/package-lock.json
      - run: npm ci
        working-directory: modules/web/app
      - run: npm run build
        working-directory: modules/web/app
      - run: npx playwright install --with-deps chromium
        working-directory: modules/web/app
      - name: Generate baselines
        working-directory: modules/web/app
        env:
          MOYU_UPDATE_SNAPSHOTS: "1"
        run: |
          set +e
          npx playwright test tests/e2e/smoke.e2e.ts -g "theme screenshots" \
            --update-snapshots=all 2>&1 | tee /tmp/playwright.log
          status=${PIPESTATUS[0]}
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -120 /tmp/playwright.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/web/app/tests/e2e/smoke.e2e.ts-snapshots
          git commit -m "test: 生成主题截图基线" || exit 0
          git push origin main
