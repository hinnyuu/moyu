name: visual-baseline

on:
  workflow_dispatch:
  push:
    branches: [visual-baseline]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modules/web/app/package-lock.json
      - run: npm ci
        working-directory: modules/web/app
      - run: npm run build
        working-directory: modules/web/app
      - run: npx playwright install --with-deps chromium
        working-directory: modules/web/app
      - name: Generate baselines
        working-directory: modules/web/app
        env:
          MOYU_UPDATE_SNAPSHOTS: "1"
          MOYU_E2E_NO_WEBSERVER: "1"
        run: |
          npm run preview -- --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:4173/"; then ready=1; break; fi
            sleep 1
          done
          set +e
          if [ "$ready" -eq 1 ]; then
            npm run test:e2e -- tests/e2e/smoke.e2e.ts -g "theme screenshots" \
              --update-snapshots=all 2>&1 | tee /tmp/playwright.log
            status=${PIPESTATUS[0]}
          else
            echo "vite preview 未启动" > /tmp/playwright.log
            status=1
          fi
          cat /tmp/preview.log >> /tmp/playwright.log
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -160 /tmp/playwright.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Commit failure diagnostics
        if: failure()
        run: |
          cp /tmp/playwright.log baseline-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baseline-error.log || true
          git commit -m "ci: 截图基线生成日志" || true
          git push origin main || true

      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add modules/web/app/tests/e2e/smoke.e2e.ts-snapshots
          git commit -m "test: 生成主题截图基线" || exit 0
          git push origin main
