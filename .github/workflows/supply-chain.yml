name: supply-chain

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny
        run: cargo deny check 2>&1 | tee /tmp/deny.log
      - name: Commit failure log
        if: failure()
        run: |
          cp /tmp/deny.log deny-error.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deny-error.log || true
          git commit -m "ci: cargo-deny 失败日志" || true
          git push origin main || true
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
